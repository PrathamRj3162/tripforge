name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is created by your first local `npm install`; commit it.
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tests, build and bundle audit
        run: npm run check
